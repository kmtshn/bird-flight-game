<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bird Flight</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#071423;color:#fff;font-family:system-ui,sans-serif}
    #hud{position:fixed;z-index:2;left:18px;top:16px;padding:12px 14px;border-radius:12px;background:#071423cc;backdrop-filter:blur(8px);line-height:1.5;font-size:14px}
    #status{color:#9bdcff;margin-top:4px;font-size:12px}
    canvas{display:block}
    #touch{display:none;position:fixed;z-index:3;inset:auto 18px 18px 18px;justify-content:space-between;align-items:end;pointer-events:none;user-select:none;touch-action:none}
    #stick{width:118px;height:118px;border:2px solid #ffffff66;border-radius:50%;background:#07142388;position:relative;pointer-events:auto;touch-action:none}
    #knob{width:48px;height:48px;border-radius:50%;background:#9bdcffcc;position:absolute;left:33px;top:33px;box-shadow:0 0 18px #9bdcff66}
    #buttons{display:flex;gap:10px;pointer-events:auto}
    .touch-btn{width:62px;height:62px;border:1px solid #ffffff66;border-radius:18px;background:#071423bb;color:#fff;font-weight:700;font-size:13px;touch-action:none}
    .touch-btn:active{background:#277b9dcc}
    @media (pointer:coarse), (max-width:700px){#touch{display:flex}#hud{left:10px;top:10px;font-size:12px;padding:9px 11px}}
  </style>
</head>
<body>
  <div id="hud"><strong>Bird Flight</strong><br><span class="desktop-help">WASD / 矢印: 飛行　Space: 上昇　Shift: 下降</span><span class="mobile-help">左スティック: 飛行　▲▼: 高さ</span><br><span id="status">読み込み中…</span></div>
  <div id="touch" aria-label="タッチ操作">
    <div id="stick" aria-label="移動スティック"><div id="knob"></div></div>
    <div id="buttons"><button class="touch-btn" data-key=" ">▲<br>上昇</button><button class="touch-btn" data-key="shift">▼<br>下降</button></div>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { createLandscape, groundHeight } from './landscape.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071423);
    scene.fog = new THREE.Fog(0x071423, 35, 120);
    const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .05, 1400);
    camera.position.set(0, 3, 8);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const landscape=createLandscape(scene,renderer);

    const keys = new Set();
    addEventListener('keydown',e=>{keys.add(e.key.toLowerCase()); if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault()});
    addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
    const touchInput={x:0,z:0};
    const stick=document.querySelector('#stick'), knob=document.querySelector('#knob');
    let stickPointer=null;
    function updateStick(e){
      const r=stick.getBoundingClientRect(), max=35, dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
      const len=Math.min(Math.hypot(dx,dy),max), a=Math.atan2(dy,dx), px=Math.cos(a)*len, py=Math.sin(a)*len;
      knob.style.transform=`translate(${px}px,${py}px)`; touchInput.x=px/max; touchInput.z=py/max;
    }
    function resetStick(){stickPointer=null; knob.style.transform='translate(0,0)'; touchInput.x=0; touchInput.z=0}
    stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId; stick.setPointerCapture(e.pointerId); updateStick(e)});
    stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)updateStick(e)});
    stick.addEventListener('pointerup',resetStick); stick.addEventListener('pointercancel',resetStick);
    document.querySelectorAll('.touch-btn').forEach(btn=>{
      const key=btn.dataset.key;
      btn.addEventListener('pointerdown',e=>{e.preventDefault(); keys.add(key); btn.setPointerCapture(e.pointerId)});
      btn.addEventListener('pointerup',()=>keys.delete(key)); btn.addEventListener('pointercancel',()=>keys.delete(key));
    });
    let bird, mixer, wingAction, velocity=new THREE.Vector3(), t=0;
    const status=document.querySelector('#status');
    new GLTFLoader().load('bird_wind_baked.glb',gltf=>{
      bird=gltf.scene; bird.scale.setScalar(1.55); bird.position.set(0,1,0); scene.add(bird);
      bird.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
      const flightClip=gltf.animations.find(clip=>clip.name==='Bird_Flight_Fresh');
      if(!flightClip){status.textContent='飛行アニメーションが見つかりません'; return}
      mixer=new THREE.AnimationMixer(bird); mixer.clipAction(flightClip).play();
      status.textContent='飛行中。モデル読込完了';
    },undefined,()=>status.textContent='アニメーションGLBを読み込めませんでした');

    const clock=new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05); t+=dt;
      if(bird){
        const x=(keys.has('a')||keys.has('arrowleft')?-1:0)+(keys.has('d')||keys.has('arrowright')?1:0)+touchInput.x;
        const z=(keys.has('w')||keys.has('arrowup')?1:0)+(keys.has('s')||keys.has('arrowdown')?-1:0)+touchInput.z;
        const y=(keys.has(' ')?1:0)+(keys.has('shift')?-1:0);
        const input=new THREE.Vector3(x,y,z); if(input.lengthSq()) input.normalize();
        velocity.lerp(input.multiplyScalar(7),1-Math.pow(.001,dt)); bird.position.addScaledVector(velocity,dt);
        bird.position.x=THREE.MathUtils.clamp(bird.position.x,-90,90); bird.position.y=THREE.MathUtils.clamp(bird.position.y,Math.max(-1,groundHeight(bird.position.x,bird.position.z)+2),80); bird.position.z=THREE.MathUtils.clamp(bird.position.z,-180,120);
        bird.rotation.z=THREE.MathUtils.lerp(bird.rotation.z,-velocity.x*.08,1-Math.pow(.01,dt)); bird.rotation.x=THREE.MathUtils.lerp(bird.rotation.x,velocity.z*.05,1-Math.pow(.01,dt));
        const desired=camera.position.clone().lerp(new THREE.Vector3(bird.position.x,bird.position.y+2.2,bird.position.z+8),1-Math.pow(.002,dt)); camera.position.copy(desired); camera.lookAt(bird.position.x,bird.position.y+.2,bird.position.z-2);
      }
      if(mixer)mixer.update(dt); landscape.update(dt,t); renderer.render(scene,camera);
    }
    animate(); addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
